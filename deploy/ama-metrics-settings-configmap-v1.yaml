apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-prometheus-config
  namespace: kube-system
data:
  prometheus-config: |-
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: azure_metrics_vmss
        scheme: http
        metrics_path: /metrics
        # Scrape the stable Kubernetes Service name, not individual exporter
        # pods. The Service selector already points only at the service-ready
        # leader pod (`vmss-metrics-exporter-leader=true`). Pod discovery adds
        # `pod`/endpoint identity labels and creates new time series on every
        # rollout, which shows up as Grafana gaps even when the Service itself
        # continuously returns valid metrics.
        static_configs:
          - targets:
              - vmss-metrics-exporter.default.svc.cluster.local:8000
            labels:
              namespace: default
              service: vmss-metrics-exporter
