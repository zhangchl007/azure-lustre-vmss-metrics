apiVersion: batch/v1
kind: Job
metadata:
  name: waymo-dataset-download
  namespace: lustre-pressure-test
  labels:
    app.kubernetes.io/name: waymo-download
    app.kubernetes.io/part-of: azure-managed-lustre-pressure-test
spec:
  backoffLimit: 3
  # 24h deadline — large dataset
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waymo-download
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.azure.com/agentpool: juicefspool
      containers:
        - name: download
          image: rclone/rclone:1.69
          env:
            - name: RCLONE_CONFIG_GCS_TYPE
              value: google cloud storage
            - name: RCLONE_CONFIG_GCS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gcp-credentials
                  key: client-id
            - name: RCLONE_CONFIG_GCS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gcp-credentials
                  key: client-secret
            - name: GCS_TOKEN_PATH
              value: /secrets/gcp/token.json
            - name: DEST
              value: /mnt/lustre/waymo_v2
            - name: SOURCE
              value: gcs:waymo_open_dataset_v_2_0_1
            - name: RCLONE_TRANSFERS
              value: "32"
            - name: RCLONE_CHECKERS
              value: "16"
            - name: RCLONE_BUFFER_SIZE
              value: 32M
            - name: RCLONE_STATS
              value: 30s
            - name: RCLONE_STATS_ONE_LINE
              value: "true"
            - name: RCLONE_LOG_LEVEL
              value: INFO
          command:
            - /bin/sh
            - -ec
            - |
              echo "=== $(date -u) Starting Waymo download with rclone ==="
              echo "Destination: ${DEST}"
              echo "Source: ${SOURCE}"

              test -s "${GCS_TOKEN_PATH}" \
                || { echo "ERROR: ${GCS_TOKEN_PATH} missing or empty" >&2; exit 1; }
              export RCLONE_CONFIG_GCS_TOKEN="$(cat "${GCS_TOKEN_PATH}")"

              mkdir -p "${DEST}"

              echo "=== Source smoke test ==="
              rclone lsd "${SOURCE}"

              echo "=== Initial destination usage ==="
              df -h /mnt/lustre
              du -sh "${DEST}" 2>/dev/null || true

              echo "=== $(date -u) Starting GCS -> Lustre copy ==="
              rclone copy "${SOURCE}" "${DEST}" \
                --fast-list \
                --metadata \
                --progress

              echo "=== Final disk usage ==="
              df -h /mnt/lustre
              echo "=== Dataset directory listing ==="
              du -sh "${DEST}"/* 2>/dev/null || ls -la "${DEST}/"
              echo "=== $(date -u) Download complete ==="
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: lustre
              mountPath: /mnt/lustre
            - name: gcp-creds
              mountPath: /secrets/gcp
              readOnly: true
      volumes:
        - name: lustre
          persistentVolumeClaim:
            claimName: lustre-pressure-test-pvc
        - name: gcp-creds
          secret:
            secretName: gcp-credentials
