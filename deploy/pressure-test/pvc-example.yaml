# Static PV/PVC for the dedicated Azure Managed Lustre test filesystem
# `almfstestcluster02` in resource group `LUSTRE-RG`.
#
# This uses the Azure-provided CSI values from:
#   az resource show --resource-group LUSTRE-RG \
#     --name almfstestcluster02 \
#     --resource-type Microsoft.StorageCache/amlFilesystems
#
# The reclaim policy is Retain so deleting Kubernetes objects does not delete
# the existing Azure Managed Lustre filesystem.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sc-almfstestcluster02-static
  labels:
    app.kubernetes.io/name: lustre-pressure-test
    app.kubernetes.io/part-of: azure-managed-lustre-pressure-test
provisioner: azurelustre.csi.azure.com
parameters:
  fs-name: lustrefs
  mgs-ip-address: 10.10.16.5
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - noatime
  - flock
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-almfstestcluster02-pressure-test
  labels:
    app.kubernetes.io/name: lustre-pressure-test
    app.kubernetes.io/part-of: azure-managed-lustre-pressure-test
    azure.workload/resource-group: LUSTRE-RG
    azure.workload/resource-name: almfstestcluster02
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 8.0Ti
  csi:
    driver: azurelustre.csi.azure.com
    volumeAttributes:
      fs-name: lustrefs
      mgs-ip-address: 10.10.16.5
    volumeHandle: 594308f7-40d4-429d-9120-978be2fab316
  mountOptions:
    - noatime
    - flock
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sc-almfstestcluster02-static
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lustre-pressure-test-pvc
  namespace: lustre-pressure-test
  labels:
    app.kubernetes.io/name: lustre-pressure-test
    app.kubernetes.io/part-of: azure-managed-lustre-pressure-test
spec:
  accessModes:
    - ReadWriteMany
  volumeName: pv-almfstestcluster02-pressure-test
  storageClassName: sc-almfstestcluster02-static
  resources:
    requests:
      storage: 8.0Ti
